<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="240">
  <defs>
    <!-- Background Gradient (Tokyo Night / Deep Sea) -->
    <linearGradient id="oceanBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="40%" stop-color="#0f1d36" />
      <stop offset="85%" stop-color="#091b2e" />
      <stop offset="100%" stop-color="#050e18" />
    </linearGradient>

    <!-- Sand Gradient -->
    <linearGradient id="sandBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Water Surface Light Effect -->
    <linearGradient id="surfaceGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>

    <style>
      /* <![CDATA[ */
      .bubble {
        fill: #38bdf8;
        opacity: 0.5;
        animation: rise linear infinite;
      }
      @keyframes rise {
        0% { transform: translateY(220px) translateX(0); opacity: 0; }
        20% { opacity: 0.6; }
        80% { opacity: 0.6; }
        100% { transform: translateY(-20px) translateX(15px); opacity: 0; }
      }

      /* Fish Animations */
      .fish-right {
        animation: swimR 14s linear infinite;
      }
      .fish-right-fast {
        animation: swimR 9s linear infinite;
      }
      .fish-left {
        animation: swimL 16s linear infinite;
      }
      .fish-left-fast {
        animation: swimL 11s linear infinite;
      }

      @keyframes swimR {
        0% { transform: translateX(-80px) translateY(0); }
        50% { transform: translateX(450px) translateY(-12px); }
        100% { transform: translateX(950px) translateY(5px); }
      }
      @keyframes swimL {
        0% { transform: translateX(920px) translateY(0); }
        50% { transform: translateX(400px) translateY(10px); }
        100% { transform: translateX(-100px) translateY(-6px); }
      }

      /* Jellyfish Pulse and Drift */
      .jellyfish {
        animation: jellyDrift 18s ease-in-out infinite alternate;
      }
      @keyframes jellyDrift {
        0% { transform: translate(160px, 150px) scale(0.9); }
        50% { transform: translate(220px, 60px) scale(1); }
        100% { transform: translate(180px, 20px) scale(0.95); }
      }

      /* Seaweed Sway */
      .seaweed-1 {
        transform-origin: bottom center;
        animation: sway 4s ease-in-out infinite alternate;
      }
      .seaweed-2 {
        transform-origin: bottom center;
        animation: sway 5s ease-in-out infinite alternate-reverse;
      }
      @keyframes sway {
        0% { transform: rotate(-5deg); }
        100% { transform: rotate(7deg); }
      }

      .text-title {
        font-family: 'Fira Code', 'Courier New', monospace;
        font-size: 13px;
        fill: #38bdf8;
        letter-spacing: 2px;
        opacity: 0.85;
      }
      /* ]]> */
    </style>
  </defs>

  <!-- Tank Container / Glass Background -->
  <rect width="850" height="240" rx="16" fill="url(#oceanBg)" stroke="#1e293b" stroke-width="2"/>

  <!-- Surface Light Beam -->
  <rect x="0" y="0" width="850" height="15" fill="url(#surfaceGlow)" />
  <line x1="0" y1="15" x2="850" y2="15" stroke="#38bdf8" stroke-opacity="0.3" stroke-dasharray="12,8" />

  <!-- Title Badge Top Center -->
  <g transform="translate(425, 28)">
    <text text-anchor="middle" class="text-title">🐠 DEV AQUARIUM • LIVE CODE HABITAT 🫧</text>
  </g>

  <!-- Bubbles with different delays and positions -->
  <g>
    <circle cx="95" cy="0" r="3.5" class="bubble" style="animation-duration: 7s; animation-delay: 0s;" />
    <circle cx="210" cy="0" r="2" class="bubble" style="animation-duration: 9s; animation-delay: 2s;" />
    <circle cx="340" cy="0" r="4" class="bubble" style="animation-duration: 6.5s; animation-delay: 1.5s;" />
    <circle cx="490" cy="0" r="3" class="bubble" style="animation-duration: 8s; animation-delay: 3s;" />
    <circle cx="620" cy="0" r="2.5" class="bubble" style="animation-duration: 7.5s; animation-delay: 4.5s;" />
    <circle cx="760" cy="0" r="4.5" class="bubble" style="animation-duration: 8.5s; animation-delay: 1s;" />
  </g>

  <!-- Jellyfish (Pulsing Drift) -->
  <g class="jellyfish">
    <!-- Jelly Head -->
    <path d="M 0 0 C -15 -18, 15 -18, 0 0 Z" fill="#ec4899" opacity="0.65" transform="scale(1.8)"/>
    <ellipse cx="0" cy="0" rx="20" ry="12" fill="#ec4899" opacity="0.75" />
    <ellipse cx="0" cy="-2" rx="14" ry="7" fill="#f472b6" opacity="0.9" />
    <!-- Tentacles -->
    <path d="M -10 10 Q -15 25 -8 40 Q -3 55 -6 68" fill="none" stroke="#f472b6" stroke-width="1.8" opacity="0.6" />
    <path d="M -3 12 Q 2 28 -2 44 Q 3 58 0 72" fill="none" stroke="#ec4899" stroke-width="2" opacity="0.8" />
    <path d="M 4 12 Q 8 26 5 42 Q 10 56 6 70" fill="none" stroke="#f472b6" stroke-width="1.8" opacity="0.7" />
    <path d="M 11 10 Q 16 24 10 39 Q 15 54 13 67" fill="none" stroke="#ec4899" stroke-width="1.8" opacity="0.6" />
  </g>

  <!-- Fish 1: Clownfish / Orange Fish swimming Right -->
  <g class="fish-right" style="animation-delay: 0s;">
    <g transform="translate(0, 75)">
      <!-- Tail -->
      <polygon points="-28,-9 -28,9 -15,0" fill="#f97316" />
      <polygon points="-25,-6 -25,6 -17,0" fill="#ffffff" />
      <!-- Body -->
      <ellipse cx="0" cy="0" rx="22" ry="13" fill="#f97316" />
      <!-- White stripes -->
      <path d="M -4,-12 Q -2,0 -4,12 L 1,12 Q 3,0 1,-12 Z" fill="#ffffff" />
      <path d="M 8,-10 Q 9,0 8,10 L 12,9 Q 13,0 12,-9 Z" fill="#ffffff" />
      <!-- Fin -->
      <path d="M -3,2 Q 3,11 -2,9 Z" fill="#ea580c" />
      <!-- Eye -->
      <circle cx="14" cy="-3" r="2.5" fill="#ffffff" />
      <circle cx="15.5" cy="-3" r="1.3" fill="#000000" />
    </g>
  </g>

  <!-- Fish 2: Neon Cyan Fish swimming Left -->
  <g class="fish-left" style="animation-delay: 2s;">
    <g transform="translate(0, 130)">
      <!-- Tail -->
      <polygon points="26,-8 26,8 14,0" fill="#06b6d4" />
      <!-- Body -->
      <ellipse cx="0" cy="0" rx="20" ry="9" fill="#0ea5e9" />
      <path d="M -16,0 Q 0,-3 14,0 Q 0,3 -16,0" fill="#38bdf8" />
      <!-- Eye -->
      <circle cx="-12" cy="-2" r="2" fill="#ffffff" />
      <circle cx="-13" cy="-2" r="1" fill="#0f172a" />
    </g>
  </g>

  <!-- Fish 3: Small Purple/Violet Fish swimming Right (Faster) -->
  <g class="fish-right-fast" style="animation-delay: 4.5s;">
    <g transform="translate(0, 165)">
      <polygon points="-18,-6 -18,6 -10,0" fill="#a855f7" />
      <ellipse cx="0" cy="0" rx="14" ry="7" fill="#8b5cf6" />
      <circle cx="9" cy="-1.5" r="1.5" fill="#ffffff" />
      <circle cx="10" cy="-1.5" r="0.8" fill="#1e1b4b" />
    </g>
  </g>

  <!-- Fish 4: Yellow Tang swimming Left -->
  <g class="fish-left-fast" style="animation-delay: 7s;">
    <g transform="translate(0, 95)">
      <!-- Tall yellow body -->
      <polygon points="22,-10 22,10 12,0" fill="#eab308" />
      <path d="M -16,0 C -8,-16 10,-12 12,0 C 10,12 -8,16 -16,0 Z" fill="#facc15" />
      <circle cx="-10" cy="-3" r="2.2" fill="#ffffff" />
      <circle cx="-11" cy="-3" r="1.1" fill="#422006" />
    </g>
  </g>

  <!-- Seabed / Sand Ground -->
  <path d="M 0,215 Q 180,205 380,218 T 850,212 L 850,240 L 0,240 Z" fill="url(#sandBg)" />

  <!-- Rocks -->
  <ellipse cx="85" cy="225" rx="35" ry="12" fill="#334155" />
  <ellipse cx="730" cy="228" rx="42" ry="14" fill="#334155" />
  <ellipse cx="765" cy="232" rx="28" ry="10" fill="#1e293b" />

  <!-- Seaweed Left Group (Swaying) -->
  <g transform="translate(50, 225)" class="seaweed-1">
    <path d="M 0,0 Q -15,-35 2,-70 Q 18,-100 0,-130" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
  </g>
  <g transform="translate(68, 226)" class="seaweed-2">
    <path d="M 0,0 Q 14,-30 -2,-60 Q -14,-85 2,-110" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  </g>
  <g transform="translate(85, 228)" class="seaweed-1">
    <path d="M 0,0 Q -10,-25 6,-55 Q 15,-75 3,-95" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
  </g>

  <!-- Seaweed Center Group -->
  <g transform="translate(450, 228)" class="seaweed-2">
    <path d="M 0,0 Q 12,-25 -4,-55 Q -12,-80 4,-100" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  </g>
  <g transform="translate(465, 228)" class="seaweed-1">
    <path d="M 0,0 Q -10,-20 8,-45 Q 12,-70 0,-85" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Seaweed Right Group -->
  <g transform="translate(710, 230)" class="seaweed-1">
    <path d="M 0,0 Q -16,-30 4,-65 Q 18,-95 2,-125" fill="none" stroke="#059669" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
  </g>
  <g transform="translate(732, 232)" class="seaweed-2">
    <path d="M 0,0 Q 15,-28 -5,-58 Q -16,-82 4,-105" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  </g>
  <g transform="translate(750, 230)" class="seaweed-1">
    <path d="M 0,0 Q -8,-25 8,-50 Q 14,-75 2,-90" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
  </g>

  <!-- Treasure Chest or Anchor decoration -->
  <g transform="translate(640, 218)">
    <rect x="-12" y="-10" width="24" height="15" rx="3" fill="#ca8a04" stroke="#854d0e" stroke-width="1.5" />
    <line x1="-12" y1="-3" x2="12" y2="-3" stroke="#854d0e" stroke-width="1.5" />
    <circle cx="0" cy="-3" r="2.5" fill="#fef08a" />
    <!-- Chest Bubbles -->
    <circle cx="2" cy="-14" r="2" class="bubble" style="animation-duration: 4s; animation-delay: 0.5s;" />
    <circle cx="-1" cy="-14" r="1.5" class="bubble" style="animation-duration: 5s; animation-delay: 1.8s;" />
  </g>

</svg>
