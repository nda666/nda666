<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" height="200">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="headerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0d1b2e" />
      <stop offset="100%" stop-color="#071322" />
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="nameGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Accent Line Gradient -->
    <linearGradient id="lineGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="1" />
      <stop offset="75%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      /* <![CDATA[ */
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.6; filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.4)); }
        50% { opacity: 1; filter: drop-shadow(0 0 16px rgba(129, 140, 248, 0.8)); }
      }

      @keyframes floatParticle {
        0%, 100% { transform: translateY(0px) scale(0.9); opacity: 0.2; }
        50% { transform: translateY(-12px) scale(1.1); opacity: 0.8; }
      }

      @keyframes scanline {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }

      .title-glow {
        animation: pulseGlow 4s ease-in-out infinite;
      }

      .particle {
        animation: floatParticle 5s ease-in-out infinite alternate;
      }

      .font-mono {
        font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace;
      }
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      /* ]]> */
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="850" height="200" rx="16" fill="url(#headerBg)" stroke="#1e293b" stroke-width="2"/>

  <!-- Subtle Grid Accent in Background -->
  <g opacity="0.07" stroke="#38bdf8" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="200" />
    <line x1="150" y1="0" x2="150" y2="200" />
    <line x1="250" y1="0" x2="250" y2="200" />
    <line x1="350" y1="0" x2="350" y2="200" />
    <line x1="450" y1="0" x2="450" y2="200" />
    <line x1="550" y1="0" x2="550" y2="200" />
    <line x1="650" y1="0" x2="650" y2="200" />
    <line x1="750" y1="0" x2="750" y2="200" />
    <line x1="0" y1="50" x2="850" y2="50" />
    <line x1="0" y1="100" x2="850" y2="100" />
    <line x1="0" y1="150" x2="850" y2="150" />
  </g>

  <!-- Terminal Window Bar Top -->
  <path d="M 0 16 C 0 7.16 7.16 0 16 0 L 834 0 C 842.84 0 850 7.16 850 16 L 850 36 L 0 36 Z" fill="#0b1322" opacity="0.8"/>
  <line x1="0" y1="36" x2="850" y2="36" stroke="#1e293b" stroke-width="1.5"/>

  <!-- macOS Window Controls -->
  <circle cx="26" cy="18" r="5.5" fill="#ef4444" opacity="0.9" />
  <circle cx="44" cy="18" r="5.5" fill="#f59e0b" opacity="0.9" />
  <circle cx="62" cy="18" r="5.5" fill="#10b981" opacity="0.9" />

  <!-- Terminal Title -->
  <text x="425" y="22" text-anchor="middle" fill="#64748b" font-size="11" class="font-mono" letter-spacing="1.5">
    ⚡ adha-bakhtiar@portfolio: ~ (zsh)
  </text>

  <!-- Floating Glowing Particles -->
  <circle cx="120" cy="85" r="2" fill="#38bdf8" class="particle" style="animation-delay: 0s;" />
  <circle cx="210" cy="160" r="1.5" fill="#818cf8" class="particle" style="animation-delay: 1.2s;" />
  <circle cx="310" cy="70" r="2.5" fill="#c084fc" class="particle" style="animation-delay: 2.5s;" />
  <circle cx="640" cy="65" r="2" fill="#38bdf8" class="particle" style="animation-delay: 1.8s;" />
  <circle cx="720" cy="145" r="1.8" fill="#818cf8" class="particle" style="animation-delay: 3.1s;" />
  <circle cx="780" cy="80" r="2.2" fill="#38bdf8" class="particle" style="animation-delay: 0.7s;" />

  <!-- Code Tag Accents Left and Right -->
  <text x="80" y="118" fill="#1e3a5f" font-size="36" class="font-mono" font-weight="700">&lt;</text>
  <text x="750" y="118" fill="#1e3a5f" font-size="36" class="font-mono" font-weight="700">/&gt;</text>

  <!-- Main Name Title -->
  <g class="title-glow" transform="translate(425, 108)">
    <text text-anchor="middle" fill="url(#nameGradient)" font-size="44" font-weight="800" class="font-sans" letter-spacing="3.5">
      ADHA BAKHTIAR
    </text>
  </g>

  <!-- Horizontal Glowing Accent Divider -->
  <line x1="200" y1="128" x2="650" y2="128" stroke="url(#lineGlow)" stroke-width="2" />

  <!-- Role Subtitle with Pill Background -->
  <g transform="translate(425, 160)">
    <rect x="-190" y="-16" width="380" height="28" rx="14" fill="#0f1f38" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.2"/>
    <text text-anchor="middle" y="3" fill="#38bdf8" font-size="12" font-weight="600" class="font-mono" letter-spacing="2">
      FULL STACK &amp; MOBILE DEVELOPER
    </text>
  </g>
</svg>
